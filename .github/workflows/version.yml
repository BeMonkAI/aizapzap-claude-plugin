name: version
on:
  pull_request:
    branches: [main]
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plugin changes must bump X-AIZapZap-Plugin-Version
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- plugins/; then echo "no plugin change"; exit 0; fi
          read_v() { python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["mcpServers"]["aizapzap"].get("headers",{}).get("X-AIZapZap-Plugin-Version",""))'; }
          new=$(read_v < plugins/aizapzap/.mcp.json)
          old=$(git show "$base":plugins/aizapzap/.mcp.json | read_v)
          echo "base=$old pr=$new"
          echo "$new" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' || { echo "::error::version must be YYYY.MM.DD[.n]"; exit 1; }
          [ "$new" != "$old" ] || { echo "::error::plugins/ changed: bump X-AIZapZap-Plugin-Version in plugins/aizapzap/.mcp.json"; exit 1; }
